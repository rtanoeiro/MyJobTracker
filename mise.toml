[vars]
BUILD_DIR = "{{ cwd }}/build"

[tools]
go = "latest"
"aqua:sqlc-dev/sqlc" = "latest"
"aqua:golangci/golangci-lint" = "latest"
"aqua:pressly/goose" = "latest"
"aqua:securego/gosec" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
air = "latest"

[tasks.clean]
description = "Clean build directory"
run = "rm -rf {{ vars.BUILD_DIR }}/*"

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.lint]
description = "Run linter"
run = "golangci-lint run ./..."

[tasks.sec]
description = "Run Go sec"
run = "gosec ./..."

[tasks.govul]
description = "Run Go sec"
run = "govulncheck ./..."

[tasks.test]
depends = ["clean"]
run = [
  "go test -failfast -timeout 5m -coverprofile='{{ vars.BUILD_DIR }}/cover.out' -cover ./internal/handlers/... ./internal/middlewares/... ./internal/session/... ./internal/templates/... ./internal/utils/...",
  "go tool cover -func='{{ vars.BUILD_DIR }}/cover.out'",
]

[tasks.checks]
depends = ["clean", "fmt", "lint", "sec", "govul", "test"]
description = "Run all checks (clean,  format, lint, security, vulnerabilities, test)"

[tasks.sqlc-generate]
description = "Generate sqlc code"
run = "sqlc generate"

[tasks.migrate]
description = "Run goose migrations (Safe for Production as it only adds attributes to tables)"
run = "goose up"

[tasks.setup-dev-data]
description = "Run goose migrations (Safe for Production as it only adds attributes to tables)"
depends = ["migrate"]
run = "bash ./seed.sh up"

[tasks.cleanup-dev-data]
description = "Run goose migrations down (WARNING: ONLY USE THIS IN DEV, AS THIS DELETES ALL DATA)"
run = "goose down-to 0"

# Build tasks are only used for prod. amd64 tags are what docker-compose-prod.yml references;
# -arm64 tags are the matching builds for ARM hosts. Push both and assemble a manifest to publish multi-arch.
[tasks.build]
description = "Build amd64 Docker image (myjobtracker:latest)"
run = "docker build -f docker/Dockerfile --platform linux/amd64 . -t rtanoeiro/myjobtracker:latest"

[tasks.build-arm64]
description = "Build arm64 Docker image (myjobtracker:latest-arm64)"
run = "docker build -f docker/Dockerfile --platform linux/arm64 . -t rtanoeiro/myjobtracker:latest-arm64"

## Dev only creates database and adminer, we use air to reload the app in dev to speed development
[tasks.up-dev]
description = "Start Containers in Dev. Only PostgreSQL and Adminer."
run = "docker compose -f docker/docker-compose-dev.yml --env-file .env up -d"

[tasks.down-dev]
description = "Stop Containers in Dev. Only PostgreSQL and Adminer"
run = "docker compose -f docker/docker-compose-dev.yml --env-file .env down"

[tasks.up-prod]
description = "Start Containers in Prod. Runs goose migrations (migrate service) before the app starts."
run = "docker compose -f docker/docker-compose.yml --env-file .env up -d"

[tasks.down-prod]
description = "Stop Containers in Prod"
run = "docker compose -f docker/docker-compose.yml --env-file .env down"

[tasks.restart-prod]
description = "Restart Containers in Prod"
run = "docker compose -f docker/docker-compose.yml --env-file .env up --force-recreate"
