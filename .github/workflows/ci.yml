name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Create build directory
        run: mkdir -p build

      - name: Run checks
        run: mise run checks
