services:
  postgresql-job-applications:
    image: postgres:17.9-alpine3.23
    container_name: postgresql-job-applications
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ${LOCAL_DATA_DIR}:/var/lib/postgresql/data
      - ../internal/db/seed/:/app/internal/db/seed/
    environment:
      - POSTGRES_DB_STRING=${POSTGRES_DB_STRING}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-9100}:8080"
